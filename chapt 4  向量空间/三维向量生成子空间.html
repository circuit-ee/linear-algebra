<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三维向量生成线与面</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #f5f7fa 0%, #e2e8f0 100%);
            color: #2d3748;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 15px;
            max-width: 250px;
            border: 2px solid rgba(203, 213, 224, 0.5);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            font-size: 14px;
            z-index: 100;
        }
        #controls {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 15px;
            border: 2px solid rgba(203, 213, 224, 0.5);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            max-height: 80vh;
            overflow-y: auto;
            width: 220px;
            z-index: 100;
        }
        button {
            margin: 8px 0;
            padding: 12px 20px;
            cursor: pointer;
            background: linear-gradient(45deg, #1e40af, #3b82f6);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(30, 64, 175, 0.3);
            width: 100%;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(30, 64, 175, 0.4);
        }
        h3 {
            margin-top: 0;
            color: #1e293b;
            border-bottom: 2px solid rgba(30, 41, 59, 0.2);
            padding-bottom: 10px;
            font-size: 16px;
        }
        h4 {
            margin: 15px 0 8px 0;
            color: #1e293b;
            font-size: 14px;
        }
        label {
            display: flex;
            align-items: center;
            margin: 12px 0;
            font-size: 14px;
        }
        input[type="checkbox"] {
            margin-right: 10px;
            width: 18px;
            height: 18px;
        }
        input[type="range"] {
            margin-left: 10px;
            flex: 1;
            height: 6px;
            background: rgba(30, 41, 59, 0.2);
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #1e40af;
            cursor: pointer;
        }
        .zoom-control {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid rgba(203, 213, 224, 0.3);
        }
        .zoom-value-display {
            text-align: center;
            font-weight: bold;
            color: #1e40af;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div id="info">
        <h3>三维向量生成线与面</h3>
        <p><strong>向量v₁</strong> = (<span id="v1x">2</span>, <span id="v1y">1</span>, <span id="v1z">1</span>) <span style="color: #dc2626;">红色</span></p>
        <p><strong>向量v₂</strong> = (<span id="v2x">1</span>, <span id="v2y">2</span>, <span id="v2z">-1</span>) <span style="color: #16a34a;">绿色</span></p>
        <p><strong>当前模式：</strong><span id="mode">显示向量</span></p>
        <p><strong>数学原理：</strong></p>
        <p>• 直线：r = t·v₁</p>
        <p>• 平面：r = s·v₁ + t·v₂</p>
    </div>
    
    <div id="controls">
        <h4>向量v₁ (红色)</h4>
        X: <input type="number" id="v1x-input" value="2" step="0.1">
        Y: <input type="number" id="v1y-input" value="1" step="0.1">
        Z: <input type="number" id="v1z-input" value="1" step="0.1">
        
        <h4>向量v₂ (绿色)</h4>
        X: <input type="number" id="v2x-input" value="1" step="0.1">
        Y: <input type="number" id="v2y-input" value="2" step="0.1">
        Z: <input type="number" id="v2z-input" value="-1" step="0.1">
        
        <button onclick="updateVectors()">更新向量</button>
        <button onclick="showVectors()">显示向量</button>
        <button onclick="showLine()">生成直线</button>
        <button onclick="showPlane()">生成平面</button>
        <button onclick="toggleRotation()">切换旋转</button>
        
        <label><input type="checkbox" id="showGrid" checked onchange="toggleGrid()"> 显示网格</label>
        <label><input type="checkbox" id="showLabels" checked onchange="toggleLabels()"> 显示标签</label>
        <label>动画速度: <input type="range" id="animationSpeed" min="0.1" max="3" step="0.1" value="1"></label>
        
        <div class="zoom-control">
            <h4>视图缩放</h4>
            <label>缩放：</label>
            <input type="range" id="zoomSlider" min="0.3" max="2.5" step="0.1" value="1">
            <div class="zoom-value-display">100%</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, vector1, vector2, line, plane;
        let isRotating = true, currentMode = 'vectors', animationId, time = 0;
        let gridHelper, axesHelper, labels = {}, showGridFlag = true, showLabelsFlag = true;
        let zoom = 1;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xffffff);
            
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(6, 4, 6);
            camera.lookAt(0, 0, 0);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);
            
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.4);
            directionalLight.position.set(5, 5, 5);
            directionalLight.castShadow = true;
            scene.add(directionalLight);
            
            createCoordinateSystem();
            createVectors();
            initZoomControl();
            animate();
        }

        function createCoordinateSystem() {
            axesHelper = new THREE.AxesHelper(4);
            scene.add(axesHelper);
            
            gridHelper = new THREE.GridHelper(8, 16, 0x6b7280, 0x9ca3af);
            gridHelper.material.opacity = 0.8;
            gridHelper.material.transparent = true;
            scene.add(gridHelper);
            
            if (showLabelsFlag) addAxisLabels();
        }

        function addAxisLabels() {
            const labelDistance = 4.5;
            
            const xGeometry = new THREE.SphereGeometry(0.1, 8, 8);
            const xMaterial = new THREE.MeshBasicMaterial({ color: 0xdc2626 });
            const xLabel = new THREE.Mesh(xGeometry, xMaterial);
            xLabel.position.set(labelDistance, 0, 0);
            scene.add(xLabel);
            labels.x = xLabel;

            const yGeometry = new THREE.SphereGeometry(0.1, 8, 8);
            const yMaterial = new THREE.MeshBasicMaterial({ color: 0x16a34a });
            const yLabel = new THREE.Mesh(yGeometry, yMaterial);
            yLabel.position.set(0, labelDistance, 0);
            scene.add(yLabel);
            labels.y = yLabel;

            const zGeometry = new THREE.SphereGeometry(0.1, 8, 8);
            const zMaterial = new THREE.MeshBasicMaterial({ color: 0x2563eb });
            const zLabel = new THREE.Mesh(zGeometry, zMaterial);
            zLabel.position.set(0, 0, labelDistance);
            scene.add(zLabel);
            labels.z = zLabel;
        }

        function getVectorValues() {
            return {
                v1: {
                    x: parseFloat(document.getElementById('v1x-input').value) || 0,
                    y: parseFloat(document.getElementById('v1y-input').value) || 0,
                    z: parseFloat(document.getElementById('v1z-input').value) || 0
                },
                v2: {
                    x: parseFloat(document.getElementById('v2x-input').value) || 0,
                    y: parseFloat(document.getElementById('v2y-input').value) || 0,
                    z: parseFloat(document.getElementById('v2z-input').value) || 0
                }
            };
        }

        function updateVectorDisplay() {
            const vectors = getVectorValues();
            document.getElementById('v1x').textContent = vectors.v1.x;
            document.getElementById('v1y').textContent = vectors.v1.y;
            document.getElementById('v1z').textContent = vectors.v1.z;
            document.getElementById('v2x').textContent = vectors.v2.x;
            document.getElementById('v2y').textContent = vectors.v2.y;
            document.getElementById('v2z').textContent = vectors.v2.z;
        }

        function createVectors() {
            const vectors = getVectorValues();
            
            if (vector1) scene.remove(vector1);
            if (vector2) scene.remove(vector2);

            const length1 = Math.sqrt(vectors.v1.x**2 + vectors.v1.y**2 + vectors.v1.z**2);
            if (length1 > 0) {
                const dir1 = new THREE.Vector3(vectors.v1.x, vectors.v1.y, vectors.v1.z).normalize();
                vector1 = new THREE.ArrowHelper(dir1, new THREE.Vector3(0, 0, 0), length1, 0xdc2626, length1 * 0.2, length1 * 0.1);
                vector1.line.material.linewidth = 4;
                vector1.renderOrder = 1; // 确保向量在顶部渲染
                scene.add(vector1);
            }

            const length2 = Math.sqrt(vectors.v2.x**2 + vectors.v2.y**2 + vectors.v2.z**2);
            if (length2 > 0) {
                const dir2 = new THREE.Vector3(vectors.v2.x, vectors.v2.y, vectors.v2.z).normalize();
                vector2 = new THREE.ArrowHelper(dir2, new THREE.Vector3(0, 0, 0), length2, 0x16a34a, length2 * 0.2, length2 * 0.1);
                vector2.line.material.linewidth = 4;
                vector2.renderOrder = 1;
                scene.add(vector2);
            }
        }

        function updateVectors() {
            updateVectorDisplay();
            createVectors();
            if (currentMode === 'line') showLine();
            else if (currentMode === 'plane') showPlane();
        }

        function showVectors() {
            clearLineAndPlane();
            currentMode = 'vectors';
            document.getElementById('mode').textContent = '显示向量';
            if (vector1) vector1.visible = true;
            if (vector2) vector2.visible = true;
        }

        function showLine() {
            clearLineAndPlane();
            currentMode = 'line';
            document.getElementById('mode').textContent = '生成直线 (r = t·v₁)';
            
            const vectors = getVectorValues();
            const length1 = Math.sqrt(vectors.v1.x**2 + vectors.v1.y**2 + vectors.v1.z**2);
            if (length1 === 0) {
                alert('向量v₁不能为零向量！');
                return;
            }
            
            const points = [];
            for (let t = -6; t <= 6; t += 0.1) {
                points.push(new THREE.Vector3(t * vectors.v1.x, t * vectors.v1.y, t * vectors.v1.z));
            }
            
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({ 
                color: 0x1e40af, 
                opacity: 0.9, 
                transparent: true,
                depthTest: true,
                depthWrite: true
            });
            line = new THREE.Line(geometry, material);
            line.renderOrder = 0; // 直线在向量下方
            scene.add(line);
            
            // 确保向量可见
            if (vector1) {
                vector1.visible = true;
                vector1.material.transparent = true;
                vector1.material.opacity = 0.4;
                vector1.material.depthTest = true;
            }
            if (vector2) {
                vector2.visible = true;
                vector2.material.transparent = true;
                vector2.material.opacity = 0.4;
                vector2.material.depthTest = true;
            }
        }

        function showPlane() {
            clearLineAndPlane();
            currentMode = 'plane';
            document.getElementById('mode').textContent = '生成平面 (r = s·v₁ + t·v₂)';
            
            const vectors = getVectorValues();
            const length1 = Math.sqrt(vectors.v1.x**2 + vectors.v1.y**2 + vectors.v1.z**2);
            const length2 = Math.sqrt(vectors.v2.x**2 + vectors.v2.y**2 + vectors.v2.z**2);
            
            if (length1 === 0 || length2 === 0) {
                alert('向量不能为零向量！');
                return;
            }
            
            const v1 = new THREE.Vector3(vectors.v1.x, vectors.v1.y, vectors.v1.z);
            const v2 = new THREE.Vector3(vectors.v2.x, vectors.v2.y, vectors.v2.z);
            const crossProduct = new THREE.Vector3().crossVectors(v1, v2);
            
            if (crossProduct.length() < 0.001) {
                alert('两个向量平行，无法生成平面！');
                return;
            }
            
            const geometry = new THREE.PlaneGeometry(8, 8, 32, 32);
            const normal = crossProduct.normalize();
            const quaternion = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 0, 1), normal);
            
            const material = new THREE.MeshPhongMaterial({ 
                color: 0x3b82f6, 
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.6,
                shininess: 100,
                depthTest: true,
                depthWrite: false // 平面不写入深度，避免遮挡
            });
            
            plane = new THREE.Mesh(geometry, material);
            plane.applyQuaternion(quaternion);
            plane.renderOrder = 0; // 平面在向量下方
            scene.add(plane);
            
            const edges = new THREE.EdgesGeometry(geometry);
            const wireframe = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ 
                color: 0x1e40af, 
                transparent: true, 
                opacity: 0.8,
                depthTest: true,
                depthWrite: true
            }));
            wireframe.applyQuaternion(quaternion);
            wireframe.renderOrder = 0;
            plane.add(wireframe);
            
            // 确保向量可见
            if (vector1) {
                vector1.visible = true;
                vector1.material.transparent = true;
                vector1.material.opacity = 0.4;
                vector1.material.depthTest = true;
            }
            if (vector2) {
                vector2.visible = true;
                vector2.material.transparent = true;
                vector2.material.opacity = 0.4;
                vector2.material.depthTest = true;
            }
        }

        function clearLineAndPlane() {
            if (line) {
                scene.remove(line);
                line = null;
            }
            if (plane) {
                scene.remove(plane);
                plane = null;
            }
        }

        function toggleRotation() {
            isRotating = !isRotating;
        }

        function toggleGrid() {
            showGridFlag = !showGridFlag;
            if (gridHelper) gridHelper.visible = showGridFlag;
            if (axesHelper) axesHelper.visible = showGridFlag;
        }

        function toggleLabels() {
            showLabelsFlag = !showLabelsFlag;
            Object.values(labels).forEach(label => {
                label.visible = showLabelsFlag;
            });
        }

        function animate() {
            animationId = requestAnimationFrame(animate);
            
            const speed = parseFloat(document.getElementById('animationSpeed').value);
            
            if (isRotating) {
                scene.rotation.y += 0.003 * speed;
            }
            
            if (currentMode === 'line' && line) {
                time += 0.02;
                line.material.opacity = 0.7 + 0.2 * Math.sin(time);
            } else if (currentMode === 'plane' && plane) {
                time += 0.01;
                plane.material.opacity = 0.6 + 0.2 * Math.sin(time);
            }
            
            renderer.render(scene, camera);
        }

        function initZoomControl() {
            const zoomSlider = document.getElementById('zoomSlider');
            const zoomValue = document.querySelector('.zoom-value-display');
            
            zoomSlider.addEventListener('input', function() {
                zoom = parseFloat(this.value);
                zoomValue.textContent = Math.round(zoom * 100) + '%';
                
                const baseDistance = 6;
                camera.position.setLength(baseDistance / zoom);
            });
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        init();
    </script>
</body>
</html>
