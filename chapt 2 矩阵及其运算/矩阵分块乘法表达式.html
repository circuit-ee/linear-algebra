<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>分块乘法——彩色子块表达式</title>
  <style>
    body{
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg,#e0f7fa 0%,#bbdefb 100%);
      margin: 0; padding: 20px;
    }
    .container{
      max-width: 1400px; margin: 0 auto;
      background: rgba(255,255,255,0.9); padding: 30px;
      border-radius: 16px; box-shadow: 0 8px 32px rgba(31,38,135,0.2);
    }
    h1{text-align: center; color: #1565c0;}
    .controls{text-align: center; margin: 20px 0;}
    button{
      margin: 8px; padding: 12px 28px; font-size: 16px;
      border: none; border-radius: 8px; cursor: pointer; transition: 0.3s;
    }
    .btn-start{background: #2196f3; color: white;}
    .btn-reset{background: #607d8b; color: white;}
    .matrix-wrapper{
      display: inline-block; margin: 20px; vertical-align: top;
    }
    .matrix{
      border-collapse: separate; border-spacing: 4px;
    }
    .matrix-cell{
      width: 240px; min-height: 80px;
      text-align: center; vertical-align: middle;
      font-weight: bold; font-size: 16px;
      border-radius: 8px; padding: 8px 6px;
      line-height: 1.4; word-break: break-all;
    }
    /* 子块底色 */
    .block1-1{background: #ffccbc;}
    .block1-2{background: #ffab91;}
    .block2-1{background: #b2dfdb;}
    .block2-2{background: #80cbc4;}
    .block3-1{background: #c5e1a5;}
    .block3-2{background: #aed581;}
    .block4-1{background: #fff59d;}
    .block4-2{background: #fff176;}
    /* 子块乘积颜色 */
    .part-A11B11{color: #ff5722; font-weight: bold;}
    .part-A12B21{color: #2196f3; font-weight: bold;}
    .part-A11B12{color: #ff5722; font-weight: bold;}
    .part-A12B22{color: #2196f3; font-weight: bold;}
    .part-A21B11{color: #4caf50; font-weight: bold;}
    .part-A22B21{color: #9c27b0; font-weight: bold;}
    .part-A21B12{color: #4caf50; font-weight: bold;}
    .part-A22B22{color: #9c27b0; font-weight: bold;}
  </style>
</head>
<body>
  <div class="container">
    <h1>分块乘法——彩色子块表达式</h1>

    <div class="controls">
      <button class="btn-start" onclick="startDemo()">开始演示</button>
      <button class="btn-reset" onclick="resetDemo()">重置</button>
    </div>

    <div style="text-align: center;">
      <div class="matrix-wrapper"><h3>矩阵 A（符号）</h3><div id="matrixA"></div></div>
      <div class="matrix-wrapper"><h3>矩阵 B（符号）</h3><div id="matrixB"></div></div>
      <div class="matrix-wrapper"><h3>结果矩阵 C（彩色表达式）</h3><div id="matrixC"></div></div>
    </div>
  </div>

  <script>
    const A = [
      ['a₁₁','a₁₂','a₁₃'],
      ['a₂₁','a₂₂','a₂₃'],
      ['a₃₁','a₃₂','a₃₃']
    ];
    const B = [
      ['b₁₁','b₁₂','b₁₃'],
      ['b₂₁','b₂₂','b₂₃'],
      ['b₃₁','b₃₂','b₃₃']
    ];
    const blockCfg = {rowSplits:[2], colSplits:[2]};

    function getBlockClass(r,c){
      let rb=0, cb=0;
      if(r<blockCfg.rowSplits[0]) rb=1; else rb=2;
      if(c<blockCfg.colSplits[0]) cb=1; else cb=2;
      const bn=(rb-1)*2+cb;
      const shade=(r+c)%2===0? '-1':'-2';
      return `block${bn}${shade}`;
    }

    function displayMatrix(mat, cid, title){
      const box=document.getElementById(cid);
      let h=`<div class="matrix-wrapper"><h4>${title}</h4><table class="matrix">`;
      for(let i=0;i<mat.length;i++){
        h+='<tr>';
        for(let j=0;j<mat[i].length;j++){
          const bc=getBlockClass(i,j);
          h+=`<td class="matrix-cell ${bc}" id="${cid}_cell_${i}_${j}">${mat[i][j]}</td>`;
        }
        h+='</tr>';
      }
      h+='</table></div>';
      box.innerHTML=h;
    }

    /* 生成彩色两部分表达式 */
    function makeColorExpr(i,j){
      const p1=[], p2=[];
      // 前半：A₁₁B₁₁ 或 A₁₁B₁₂ 等
      for(let k=0;k<blockCfg.colSplits[0];k++){
        p1.push(`a<sub>${i+1}${k+1}</sub>b<sub>${k+1}${j+1}</sub>`);
      }
      // 后半：A₁₂B₂₁ 或 A₁₂B₂₂ 等
      for(let k=blockCfg.colSplits[0];k<3;k++){
        p2.push(`a<sub>${i+1}${k+1}</sub>b<sub>${k+1}${j+1}</sub>`);
      }
      const part1=p1.join('+'), part2=p2.join('+');
      const cls1=getPartClass(i,j,1), cls2=getPartClass(i,j,2);
      if(p2.length===0) return `<span class="${cls1}">${part1}</span>`;
      return `<span class="${cls1}">${part1}</span> + <span class="${cls2}">${part2}</span>`;
    }

    function getPartClass(i,j,part){
      const blk=(i<2?'1':'2')+(j<2?'1':'2');
      if(part===1){
        if(blk==='11') return 'part-A11B11';
        if(blk==='12') return 'part-A11B12';
        if(blk==='21') return 'part-A21B11';
        if(blk==='22') return 'part-A21B12';
      }else{
        if(blk==='11') return 'part-A12B21';
        if(blk==='12') return 'part-A12B22';
        if(blk==='21') return 'part-A22B21';
        if(blk==='22') return 'part-A22B22';
      }
      return '';
    }

    function startDemo(){
      const exprMat=A.map((row,i)=>row.map((_,j)=>makeColorExpr(i,j)));
      displayMatrix(exprMat,'matrixC','结果矩阵 C（彩色表达式）');
    }

    function resetDemo(){
      displayMatrix(A,'matrixA','矩阵 A（符号）');
      displayMatrix(B,'matrixB','矩阵 B（符号）');
      displayMatrix([['','',''],['','',''],['','','']],'matrixC','结果矩阵 C（彩色表达式）');
    }

    // 初始
    resetDemo();
  </script>
</body>
</html>
