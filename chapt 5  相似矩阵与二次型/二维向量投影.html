<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>二维向量投影演示 - 高可见度版</title>
<style>
  body{margin:0;padding:20px;font-family:Arial,Helvetica,sans-serif;background:#f5f5f5;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;font-size:20px;font-weight:bold}
  .panel{background:#fff;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.15);padding:25px;max-width:1000px;width:100%}
  h1,h2{margin:0 0 15px;text-align:center;color:#333;font-weight:bold}
  h1{font-size:36px}
  h2{font-size:26px}
  .row{display:flex;justify-content:center;gap:15px;margin:12px 0}
  input[type=number]{width:80px;padding:8px;font-size:22px;text-align:center;border:2px solid #ccc;border-radius:4px;font-weight:bold}
  .controls-section{display:flex;justify-content:center;align-items:center;gap:20px;margin:15px 0}
  .zoom-control{display:flex;align-items:center;gap:12px}
  .zoom-control label{font-size:22px;font-weight:bold}
  #zoom-slider{width:180px;height:8px;-webkit-appearance:none;background:#ddd;border-radius:4px}
  #zoom-slider::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;background:#1976d2;border-radius:50%;cursor:pointer}
  #zoom-value{font-weight:bold;color:#1976d2;min-width:60px;font-size:22px}
  canvas{border:2px solid #ccc;background:#fafafa;margin:15px 0;display:block;width:100%;max-width:800px;height:auto}
  .btns{display:flex;justify-content:center;gap:15px;margin-top:20px}
  button{padding:12px 30px;font-size:22px;border:none;border-radius:6px;cursor:pointer;transition:all .2s;font-weight:bold}
  .btn-primary{background:#1976d2;color:#fff}
  .btn-primary:hover{background:#125a9c;transform:translateY(-2px)}
  .btn-secondary{background:#e0e0e0;color:#000}
  .btn-secondary:hover{background:#d0d0d0;transform:translateY(-2px)}
  .formula-section{background:#f0f8ff;padding:20px;border-radius:8px;margin:15px 0;border-left:6px solid #1976d2}
  .formula{font-size:24px;text-align:center;margin:12px 0;font-family:'Times New Roman',serif;font-weight:bold;display:flex;align-items:center;justify-content:center;gap:15px;flex-wrap:wrap}
  .formula span{display:inline-block}
  .vector-v{color:#FF0000;font-size:32px;font-weight:900}
  .vector-a{color:#0066FF;font-size:32px;font-weight:900}
  .vector-p{color:#00AA00;font-size:32px;font-weight:900}
  .vector-step{color:#FF6600;font-size:26px;font-weight:900}
  .animation-step-display{background:#fff3cd;border:4px solid #ffc107;border-radius:8px;padding:15px;margin:15px 0;text-align:center;font-size:28px;font-weight:900;color:#856404;display:none}
  .matrix-element{font-size:28px;font-weight:900;padding:0 8px}
  .highlight-formula{background:#ffeb3b;padding:8px 15px;border-radius:6px;box-shadow:0 0 10px rgba(255,235,59,0.5)}
</style>
</head>
<body>
<div class="panel">
  <h1>二维向量投影演示 - 高可见度版</h1>

  <h2>被投影向量 <span class="vector-v">v</span></h2>
  <div class="row">
    <label>x <input id="vx" type="number" value="3" step="0.1"></label>
    <label>y <input id="vy" type="number" value="2" step="0.1"></label>
  </div>

  <h2>投影方向 <span class="vector-a">a</span></h2>
  <div class="row">
    <label>x <input id="ax" type="number" value="1" step="0.1"></label>
    <label>y <input id="ay" type="number" value="1" step="0.1"></label>
  </div>

  <div class="controls-section">
    <div class="zoom-control">
      <label>🔍 缩放:</label>
      <input type="range" id="zoom-slider" min="0.5" max="2" step="0.1" value="1">
      <span id="zoom-value">1.0x</span>
    </div>
  </div>

  <div class="animation-step-display" id="animation-step-display"></div>

  <canvas id="cv" width="800" height="600"></canvas>

  <div class="formula-section">
    <div class="formula" id="formula-step1">
      <span class="vector-step">步骤1:</span> 点积 <span class="vector-v">v</span>·<span class="vector-a">a</span> = <span id="dot-product" class="matrix-element">5.00</span>
    </div>
    <div class="formula" id="formula-step2">
      <span class="vector-step">步骤2:</span> |<span class="vector-a">a</span>|² = <span id="a-norm-sq" class="matrix-element">2.00</span>
    </div>
    <div class="formula" id="formula-step3">
      <span class="vector-step">步骤3:</span> 投影 <span class="vector-p">p</span> = (<span class="vector-v">v</span>·<span class="vector-a">a</span>)/|<span class="vector-a">a</span>|² × <span class="vector-a">a</span> = <span id="proj-result" class="matrix-element">(2.50, 2.50)</span>
    </div>
    <div class="formula" id="formula-matrix">
      <span class="vector-step">矩阵形式:</span> P = (<span class="vector-a">a</span><span class="vector-a">a</span>ᵀ)/(<span class="vector-a">a</span>ᵀ<span class="vector-a">a</span>) = <span id="mat" class="matrix-element">1/2 [1 1;1 1]</span>
    </div>
  </div>

  <div class="btns">
    <button class="btn-primary" onclick="updateAll()">更新</button>
    <button class="btn-primary" onclick="animateProjection()">动画投影</button>
    <button class="btn-secondary" onclick="resetAll()">重置</button>
  </div>
</div>

<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const cx=cv.width/2,cy=cv.height/2,baseUnit=40;

let v=[3,2],a=[1,1],p=[0,0];
let zoom=1;
let currentStep=0;

function proj(v,a){
  const dot=a[0]*v[0]+a[1]*v[1],len2=a[0]**2+a[1]**2||1;
  return [dot*a[0]/len2,dot*a[1]/len2];
}

function getUnit() {
  return baseUnit * zoom;
}

function drawGrid(){
  ctx.clearRect(0,0,cv.width,cv.height);
  const unit=getUnit();
  
  ctx.strokeStyle='#e0e0e0';ctx.lineWidth=1;
  const gridRange=10;
  for(let i=-gridRange;i<=gridRange;i++){
    const pos=i*unit;
    ctx.beginPath();ctx.moveTo(cx+pos,0);ctx.lineTo(cx+pos,cv.height);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,cy-pos);ctx.lineTo(cv.width,cy-pos);ctx.stroke();
  }
  
  ctx.strokeStyle='#000';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(cx,0);ctx.lineTo(cx,cv.height);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,cy);ctx.lineTo(cv.width,cy);ctx.stroke();
}

function arrow([x,y],color,label){
  const unit=getUnit();
  const len=Math.hypot(x,y)*unit,ang=Math.atan2(-y,x);
  ctx.save();
  ctx.translate(cx,cy);ctx.rotate(ang);
  ctx.strokeStyle=color;ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(len,0);ctx.stroke();
  const h=12*zoom;
  ctx.beginPath();
  ctx.moveTo(len,0);ctx.lineTo(len-h,-h/2);ctx.lineTo(len-h,h/2);ctx.closePath();
  ctx.fillStyle=color;ctx.fill();
  ctx.restore();
  ctx.fillStyle=color;ctx.font=`bold ${Math.max(18, 22*zoom)}px Arial`;
  ctx.fillText(label,cx+x*unit+8,cy-y*unit-8);
}

function dash(){
  const unit=getUnit();
  ctx.save();ctx.translate(cx,cy);ctx.scale(1,-1);
  ctx.setLineDash([6*zoom,4*zoom]);ctx.strokeStyle='#888';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(v[0]*unit,v[1]*unit);ctx.lineTo(p[0]*unit,p[1]*unit);ctx.stroke();
  ctx.restore();
}

function draw(){
  drawGrid();
  arrow(v,'#FF0000','v');
  arrow(a,'#0066FF','a');
  arrow(p,'#00AA00','p');
  dash();
}

function updateFormulas(){
  const dotProduct = (v[0]*a[0] + v[1]*a[1]).toFixed(2);
  const aNormSq = (a[0]**2 + a[1]**2).toFixed(2);
  const projX = p[0].toFixed(2);
  const projY = p[1].toFixed(2);
  
  document.getElementById('dot-product').textContent = dotProduct;
  document.getElementById('a-norm-sq').textContent = aNormSq;
  document.getElementById('proj-result').textContent = `(${projX}, ${projY})`;
  
  const len2=a[0]**2+a[1]**2||1;
  const m11=(a[0]**2/len2).toFixed(2);
  const m12=(a[0]*a[1]/len2).toFixed(2);
  const m21=(a[1]*a[0]/len2).toFixed(2);
  const m22=(a[1]**2/len2).toFixed(2);
  document.getElementById('mat').textContent=`1/${len2} [${m11} ${m12};${m21} ${m22}]`;
}

function highlightFormula(stepId) {
  document.querySelectorAll('.formula').forEach(f => f.classList.remove('highlight-formula'));
  if(stepId) {
    document.getElementById(stepId).classList.add('highlight-formula');
  }
}

function updateAll(){
  v[0]=+document.getElementById('vx').value||0;
  v[1]=+document.getElementById('vy').value||0;
  a[0]=+document.getElementById('ax').value||0;
  a[1]=+document.getElementById('ay').value||0;
  p=proj(v,a);
  updateFormulas();
  draw();
}

function animateProjection(){
  updateAll();
  const stepDisplay = document.getElementById('animation-step-display');
  stepDisplay.style.display = 'block';
  
  let t=0;
  const dur=1800,start=performance.now();
  
  const steps = [
    {text: "步骤1: 计算点积 v·a", formula: "formula-step1", time: 0.3},
    {text: "步骤2: 计算 |a|²", formula: "formula-step2", time: 0.6},
    {text: "步骤3: 计算投影向量 p", formula: "formula-step3", time: 1.0}
  ];
  
  function step(now){
    t=(now-start)/dur;
    if(t>1) t=1;
    
    // 更新步骤显示
    let currentStepData = null;
    for(let step of steps) {
      if(t >= step.time) {
        currentStepData = step;
      }
    }
    if(currentStepData) {
      stepDisplay.textContent = currentStepData.text;
      highlightFormula(currentStepData.formula);
    }
    
    const x=v[0]*(1-t)+p[0]*t,y=v[1]*(1-t)+p[1]*t;
    drawGrid();
    arrow(v,'#FF0000','v');
    arrow(a,'#0066FF','a');
    arrow([x,y],'#00AA00','p');
    dash();
    
    if(t<1) {
      requestAnimationFrame(step);
    } else {
      stepDisplay.style.display = 'none';
      highlightFormula(null);
      updateAll();
    }
  }
  requestAnimationFrame(step);
}

function resetAll(){
  document.getElementById('vx').value=3;
  document.getElementById('vy').value=2;
  document.getElementById('ax').value=1;
  document.getElementById('ay').value=1;
  zoom=1;
  document.getElementById('zoom-slider').value=1;
  document.getElementById('zoom-value').textContent='1.0x';
  updateAll();
}

document.getElementById('zoom-slider').addEventListener('input', function(e) {
  zoom = parseFloat(e.target.value);
  document.getElementById('zoom-value').textContent = zoom.toFixed(1) + 'x';
  draw();
});

updateAll();
</script>
</body>
</html>
